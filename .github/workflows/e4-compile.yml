name: E4 standalone build (temporary)
on:
  push:
    branches: [feature/mappo-0.2e-e4-plot-count]
    paths: ['.github/workflows/e4-compile.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize latest branch
        run: git pull --rebase origin feature/mappo-0.2e-e4-plot-count
      - name: Build versioned offline HTML
        run: npm run build
      - name: Commit versioned distribution and root
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dist/mappo-0.2-dev.e4.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(e4): compile offline plot count editor'
            git push origin HEAD:feature/mappo-0.2e-e4-plot-count
          fi
