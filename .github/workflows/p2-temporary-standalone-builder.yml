# Branch-only helper to check in the reproducible standalone build once.
# Remove this workflow after its output has landed.
name: P2 temporary standalone bundle publisher
on:
  push:
    branches:
      - feature/c7-p1-background-preview

permissions:
  contents: write

concurrency:
  group: c7-p2-temporary-publisher
  cancel-in-progress: true

jobs:
  bundle:
    if: "!contains(github.event.head_commit.message, '[p2-built]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out P2 source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and commit offline standalone HTML
        run: |
          npm run build
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test "$version" = '0.2-dev.c7-p2'
          cmp index.html "dist/mappo-$version.html"
          git add index.html "dist/mappo-$version.html"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(c7-p2): publish offline standalone [p2-built]"
            git push origin HEAD:feature/c7-p1-background-preview
          fi
