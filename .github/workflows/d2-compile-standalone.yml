# Temporary D2 branch-only build publisher. Remove after the generated files land.
name: Compile D2 standalone on branch
on:
  push:
    branches:
      - feature/mappo-0.2d-d2-building-decisions
permissions:
  contents: write
jobs:
  compile:
    if: github.repository == 'xbwtyz/Mappo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mappo-0.2d-d2-building-decisions
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and commit reproducible offline bundle
        run: |
          npm run build
          git add index.html dist/mappo-0.2-dev.d2.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(d2): generate standalone 0.2-dev.d2 release"
            git push origin HEAD:feature/mappo-0.2d-d2-building-decisions
          fi
