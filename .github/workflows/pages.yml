name: Publish Mappo standalone builds to Pages

# GitHub Pages is published only when explicitly requested on main.
# Merging development PRs must never redeploy the public site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Prevent manually deploying preview or feature branches.
    if: github.ref == 'refs/heads/main'
    name: Publish standalone HTML distribution
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published sources
        uses: actions/checkout@v4
      - name: Verify latest compiled distribution matches root
        run: |
          test -f index.html
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -n "$version"
          test -f "dist/mappo-${version}.html"
          cmp index.html "dist/mappo-${version}.html"
          test "$(find dist -maxdepth 1 -name '*.html' -type f | wc -l)" -ge 26
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage existing compiled builds without renaming
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R dist _site/dist
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
