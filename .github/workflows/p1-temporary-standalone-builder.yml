# Temporary development-only bundle publisher; remove after generating files.
name: P1 temporary standalone publisher
on:
  push:
    branches:
      - feature/c7-p1-background-preview
permissions:
  contents: write
jobs:
  bundle:
    if: "!contains(github.event.head_commit.message, '[p1-built]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run build
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          git add index.html "dist/mappo-$version.html"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(p1): publish offline standalone [p1-built]"
            git push origin HEAD:feature/c7-p1-background-preview
          fi
