name: Publish Mappo 0.2.0 GitHub Release (manual)

# H1: Release is an explicit owner action; neither merging nor passing CI
# starts publishing. The existing published v0.1.0 release is never modified.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish (must match app and package, without v prefix)
        type: choice
        required: true
        options: ['0.2.0']
      confirmation:
        description: Type PUBLISH-0.2.0 to authorize a stable GitHub Release
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: mappo-release-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    # Feature-branch dispatches cannot produce tags or releases.
    if: github.repository == 'xbwtyz/Mappo' && github.ref == 'refs/heads/main'
    name: Verify exact main commit and publish v0.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require explicit stable-release confirmation
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$RELEASE_VERSION" = '0.2.0'
          test "$CONFIRMATION" = 'PUBLISH-0.2.0'

      - name: Check out the explicitly selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm stable app version and approved release notes
        run: |
          app_version="$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")"
          package_version="$(node -p "require('./package.json').version")"
          test "$app_version" = '0.2.0'
          test "$package_version" = '0.2.0'
          test -s docs/releases/v0.2.0.md
          test -f dist/mappo-0.2.0.html

      - name: Require successful main-branch CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$GITHUB_SHA"
          successful="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "Mappo CI" and .conclusion == "success")] | length')"
          test "$successful" -ge 1
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { verifiedMainRun } from './scripts/ci-focused.mjs';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const api=path=>JSON.parse(execFileSync('gh',['api','--method','GET','repos/'+repo+'/'+path],{encoding:'utf8',maxBuffer:16*1024*1024}));
          const runs=api('actions/runs?head_sha='+sha+'&event=push&per_page=100').workflow_runs;
          let qualified=false;
          for(const run of runs){
            if(run.name!=='Mappo CI'||run.conclusion!=='success'||run.head_sha!==sha||run.head_branch!=='main')continue;
            const jobs=api('actions/runs/'+run.id+'/attempts/'+run.run_attempt+'/jobs?per_page=100');
            if(verifiedMainRun(sha,run,jobs)){qualified=true;break;}
          }
          if(!qualified)throw Error('No exact-main CI with all 16 Node shards, four browser suites and aggregate passed.');
          NODE

      - name: Rebuild and retest the exact committed standalone
        run: |
          set -euo pipefail
          npm run check
          cmp index.html dist/mappo-0.2.0.html
          git diff --exit-code -- index.html dist/mappo-0.2.0.html

      - name: Publish new stable release without overwriting a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" >/dev/null 2>&1; then
            echo 'v0.2.0 tag already exists: refusing to move or overwrite it.' >&2
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists: refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create v0.2.0 \
            "dist/mappo-0.2.0.html#Mappo 0.2.0 offline HTML" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Mappo 0.2.0 — 2D City Designer' \
            --notes-file docs/releases/v0.2.0.md \
            --latest
