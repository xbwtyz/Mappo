name: E5 focused integration QA (temporary)
on:
  push:
    branches: [feature/mappo-0.2e-e5-integration]
    paths: ['.github/workflows/e5-focused.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/property-integration-e5.test.js
      - name: Informational E5 Small/Large benchmark
        run: node scripts/e5-property-performance.mjs
