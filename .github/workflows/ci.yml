name: Mappo CI

# Full review-ready validation. Keep the workflow and job names for release
# workflow_run compatibility and existing status-check configuration.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      run_c7_benchmark:
        description: Also run the desktop C7 browser performance benchmark
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mappo-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build, Node tests and browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve current standalone version
        run: |
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and run full Node regression suite
        run: npm run check

      - name: Verify checked-in compiled distribution
        run: |
          test -s index.html
          test -s "dist/mappo-$VERSION.html"
          git ls-files --error-unmatch index.html "dist/mappo-$VERSION.html" > /dev/null
          cmp index.html "dist/mappo-$VERSION.html"
          git diff --exit-code -- index.html "dist/mappo-$VERSION.html"

      - name: Install test-only Playwright browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox

      - name: Run Chromium and Firefox browser matrices
        run: npm run test:browser

      - name: C7 desktop browser performance and stale-draft checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_c7_benchmark
        run: node scripts/c7-browser-performance.mjs

      - name: Upload browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mappo-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload standalone HTML artifacts
        if: always() && env.VERSION != ''
        uses: actions/upload-artifact@v4
        with:
          name: mappo-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            index.html
            dist/mappo-${{ env.VERSION }}.html
          if-no-files-found: warn
          retention-days: 14
