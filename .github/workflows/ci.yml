name: Mappo CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mappo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Node tests and browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve current standalone version
        run: |
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and run Node regression tests
        run: npm run check

      - name: Verify checked-in compiled distribution
        run: |
          test -s index.html
          test -s "dist/mappo-$VERSION.html"
          git ls-files --error-unmatch index.html "dist/mappo-$VERSION.html" > /dev/null
          cmp index.html "dist/mappo-$VERSION.html"
          git diff --exit-code -- index.html "dist/mappo-$VERSION.html"

      - name: Install test-only Playwright browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox

      - name: Run Chromium and Firefox browser matrices
        run: npm run test:browser

      - name: C7 browser performance and stale-draft checks
        run: node scripts/c7-browser-performance.mjs

      - name: Upload browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mappo-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload standalone HTML artifacts
        if: always() && env.VERSION != ''
        uses: actions/upload-artifact@v4
        with:
          name: mappo-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            index.html
            dist/mappo-${{ env.VERSION }}.html
          if-no-files-found: warn
          retention-days: 14
