name: E5 standalone compiler (temporary)
on:
  push:
    branches: [feature/mappo-0.2e-e5-integration]
    paths: ['.github/workflows/e5-compile.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync latest source before building
        run: git pull --rebase origin feature/mappo-0.2e-e5-integration
      - name: Build offline standalone E5 distribution
        run: npm run build
      - name: Commit versioned and root HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dist/mappo-0.2-dev.e5.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(e5): compile cross-editor QA standalone'
            git push origin HEAD:feature/mappo-0.2e-e5-integration
          fi
