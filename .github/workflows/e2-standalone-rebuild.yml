name: E2 standalone rebuild (temporary)
on:
  push:
    branches: [feature/mappo-0.2e-e2-straight-property-split]
    paths:
      - '.github/workflows/e2-standalone-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile checked-in E2 standalone files
        run: npm run build
      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dist/mappo-0.2-dev.e2.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(e2): sync checked-in standalone after source fixes'
            git push origin HEAD:feature/mappo-0.2e-e2-straight-property-split
          fi
