name: Mappo Phase 6 check
on:
  push:
    branches: [feature/ui-phase-6]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: git diff --exit-code -- index.html dist/mappo-0.1-dev.ui6a.html
