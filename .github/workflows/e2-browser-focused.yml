name: E2 Focused Browser QA (temporary)
on:
  push:
    branches:
      - feature/mappo-0.2e-e2-straight-property-split
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone
        run: npm run build
      - name: Install Chromium and Firefox
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium firefox
      - name: E2 compiled browser acceptance
        run: node scripts/property-split-e2-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2-browser-failures
          path: artifacts/e2/
          if-no-files-found: ignore
