name: E3 focused model verification (temporary)
on:
  push:
    branches: [feature/mappo-0.2e-e3-property-merge]
    paths: ['.github/workflows/e3-focused-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E3 model tests
        run: node --test tests/property-merge-e3.test.js
