name: E1 temporary compiler and targeted acceptance
on:
  push:
    branches: [feature/mappo-0.2e-e1-property-creation]
permissions:
  contents: write
concurrency:
  group: mappo-e1-compiler
  cancel-in-progress: true
jobs:
  e1:
    if: "!startsWith(github.event.head_commit.message, 'build(e1): compile')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mappo-0.2e-e1-property-creation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run targeted E1 Node tests
        run: |
          npm run build
          node --test tests/property-creation-e1.test.js
      - name: Compile byte-identical E1 distribution
        run: |
          cmp index.html dist/mappo-0.2-dev.e1.html
          git add index.html dist/mappo-0.2-dev.e1.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(e1): compile standalone HTML after targeted acceptance"
            git push origin HEAD:feature/mappo-0.2e-e1-property-creation
          fi
