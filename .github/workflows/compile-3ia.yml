name: Compile Mappo 3I-A distribution
on:
  push:
    branches: [feature/property-plot-editing-3i]
    paths: ['.github/workflows/compile-3ia.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build checked-in standalone and root HTML
        run: npm run build
      - name: Commit compiled outputs to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/mappo-0.1-dev.3ia.html
          if ! git diff --cached --quiet; then
            git commit -m "build(3I-A): compile versioned standalone HTML"
            git push origin HEAD:feature/property-plot-editing-3i
          fi
