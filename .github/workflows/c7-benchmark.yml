name: C7 browser benchmark (development branch)

on:
  push:
    branches:
      - feature/mappo-0-2c-c7-finalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c7-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current standalone
        run: npm run build
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Measure C7 browser behavior
        run: node scripts/c7-browser-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c7-benchmark-${{ github.run_id }}
          path: artifacts/c7/
          if-no-files-found: ignore
          retention-days: 14
