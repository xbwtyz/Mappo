# Temporary D3 fix compiler and targeted verification; removed once generated files are committed.
name: D3 fix build and focused regression
on:
  push:
    branches:
      - feature/mappo-0.2d-d3-blocked-recovery
permissions:
  contents: write
concurrency:
  group: d3-fix-rebuild
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mappo-0.2d-d3-blocked-recovery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and run D3 acceptance tests
        run: |
          npm run build
          node --test tests/road-editor-acceptance.test.js
      - name: Commit D3 distribution for regular CI
        run: |
          git add index.html dist/mappo-0.2-dev.d3.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(d3): refresh standalone after recovery fixes"
            git push origin HEAD:feature/mappo-0.2d-d3-blocked-recovery
          fi
