name: Temporary 3G-D standalone compiler
# Rebuild after collision-proof source symbol update.

on:
  push:
    branches: ['feature/building-history-3gd']
    paths: ['.github/workflows/compile-3gd.yml']

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the exact versioned distribution from modular sources
        run: npm run build
      - name: Commit generated standalone artifacts to the approved feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/mappo-0.1-dev.3gd.html
          git commit -m "build(3g-d5): generate checked-in standalone artifacts" || exit 0
          git push origin HEAD:feature/building-history-3gd
      - name: Run Node regression suite
        run: npm test
