name: Mappo Milestone 3F validation

on:
  push:
    branches: [feature/building-inspector-3f]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mappo-3f
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run regression suite
        run: npm run check
      - name: Verify committed standalone distribution
        run: |
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          cmp index.html "dist/mappo-$version.html"
          git diff --exit-code -- index.html "dist/mappo-$version.html"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install test-only browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Existing standalone browser smoke matrix
        run: node scripts/browser-qa.mjs
      - name: Building selection browser matrix
        run: node scripts/building-browser-qa.mjs
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mappo-3f-browser-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
      - name: Archive checkpoint standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: mappo-${{ env.VERSION }}-${{ github.sha }}
          path: |
            index.html
            dist/mappo-${{ env.VERSION }}.html
          if-no-files-found: error
