name: Compile Mappo 3I-B distribution
on:
  push:
    branches: [feature/property-plot-editing-3i]
    paths: ['.github/workflows/compile-3ib.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 3I-B standalone distribution
        run: npm run build
      - name: Commit build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/mappo-0.1-dev.3ib.html
          if ! git diff --cached --quiet; then
            git commit -m "build(3I-B): compile standalone HTML"
            git push origin HEAD:feature/property-plot-editing-3i
          fi
