name: Mappo Fast Checks

# Fast branch feedback. A matching ready or explicitly requested draft PR owns full CI.
on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: mappo-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Build, syntax and targeted Node smoke tests
    runs-on: ubuntu-24.04
    # Conservative fallback can include the complete Node inventory.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip duplicate tests when a matching PR has full CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-trigger.mjs fast

      - name: Select exact-push incremental checks
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-focused.mjs plan

      - name: Check changed JavaScript syntax
        if: steps.gate.outputs.run == 'true'
        run: node scripts/ci-focused.mjs syntax

      - name: Build and verify offline standalone parity
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm run build
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -s index.html
          test -s "dist/mappo-$version.html"
          git ls-files --error-unmatch index.html "dist/mappo-$version.html" > /dev/null
          cmp index.html "dist/mappo-$version.html"
          git diff --exit-code -- index.html "dist/mappo-$version.html"

      - name: Run smoke tests and directly modified Node tests
        # Baseline includes tests/ci-trigger.test.js; profiles are incremental only.
        if: steps.gate.outputs.run == 'true'
        run: node scripts/ci-focused.mjs test

      - name: Prepare exact-candidate manual acceptance package
        if: steps.gate.outputs.run == 'true' && contains(github.event.head_commit.message, '[acceptance-package]')
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: node scripts/development/manual-acceptance.mjs

      - name: Upload manual acceptance package
        if: steps.gate.outputs.run == 'true' && contains(github.event.head_commit.message, '[acceptance-package]')
        uses: actions/upload-artifact@v4
        with:
          name: mappo-manual-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/manual-acceptance/
          if-no-files-found: error
          retention-days: 14
