name: Mappo Fast Checks

# Fast branch feedback. A matching ready or explicitly requested draft PR owns full CI.
on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: mappo-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Build, syntax and targeted Node smoke tests
    outputs:
      run: ${{ steps.gate.outputs.run }}
      parallel: ${{ steps.plan.outputs.parallel }}
      matrix: ${{ steps.plan.outputs.matrix }}
    runs-on: ubuntu-24.04
    # Conservative fallback can include the complete Node inventory.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip duplicate tests when a matching PR has full CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-trigger.mjs fast

      - name: Validate eligible archival-only push
        id: archive
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-archive.mjs

      - name: Select exact-push incremental checks
        id: plan
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-focused.mjs plan

      - name: Check changed JavaScript syntax
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-focused.mjs syntax

      - name: Build and verify offline standalone parity
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true'
        shell: bash
        run: |
          npm run build
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -s index.html
          test -s "dist/mappo-$version.html"
          git ls-files --error-unmatch index.html "dist/mappo-$version.html" > /dev/null
          cmp index.html "dist/mappo-$version.html"
          git diff --exit-code -- index.html "dist/mappo-$version.html"

      - name: Run smoke tests and directly modified Node tests
        # Baseline includes tests/ci-trigger.test.js; profiles are incremental only.
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true' && steps.plan.outputs.parallel == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-focused.mjs test

      - name: Retain exact focused execution plan
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true' && steps.plan.outputs.parallel == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.plan_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare exact-candidate manual acceptance package
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true' && contains(github.event.head_commit.message, '[acceptance-package]')
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: node scripts/development/manual-acceptance.mjs

      - name: Upload manual acceptance package
        if: steps.gate.outputs.run == 'true' && steps.archive.outputs.archive != 'true' && contains(github.event.head_commit.message, '[acceptance-package]')
        uses: actions/upload-artifact@v4
        with:
          name: mappo-manual-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/manual-acceptance/
          if-no-files-found: error
          retention-days: 14

  parallel:
    needs: fast
    if: needs.fast.outputs.run == 'true' && needs.fast.outputs.parallel == 'true'
    name: Focused Node (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.fast.outputs.matrix || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-plan
      - name: Build exact standalone and verify parity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run build
          git diff --exit-code -- index.html dist/
      - name: Run assigned focused tests
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_PLAN_PATH: focused-plan/mappo-focus-plan.json
          FOCUS_SHARD: ${{ matrix.shard }}
        run: node scripts/ci-focused.mjs shard
      - uses: actions/upload-artifact@v4
        with:
          name: focused-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: artifacts/ci-timings/node-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  completeness:
    needs: [fast, parallel]
    if: ${{ always() && needs.fast.outputs.run == 'true' && needs.fast.outputs.parallel == 'true' }}
    name: Focused execution completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all planned shards to succeed
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          PARALLEL_RESULT: ${{ needs.parallel.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$PARALLEL_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: focused-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: focused-report-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: focused-reports
          merge-multiple: true
      - name: Verify exact selected inventory and all shard reports
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_PLAN_PATH: focused-plan/mappo-focus-plan.json
        run: node scripts/ci-focused.mjs complete
