name: Mappo Fast Checks

# Fast branch feedback. A matching ready or explicitly requested draft PR owns full CI.
on:
  push:
    branches:
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mappo-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Build, syntax and targeted Node smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip duplicate tests when a matching PR has full CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-trigger.mjs fast

      - name: Check changed JavaScript syntax
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          while IFS= read -r path; do
            if [[ -f "$path" && ( "$path" == *.js || "$path" == *.mjs ) ]]; then
              node --check "$path"
            fi
          done < <(git diff --name-only HEAD^ HEAD -- src/ scripts/ tests/)

      - name: Build and verify offline standalone parity
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm run build
          version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
          test -s index.html
          test -s "dist/mappo-$version.html"
          git ls-files --error-unmatch index.html "dist/mappo-$version.html" > /dev/null
          cmp index.html "dist/mappo-$version.html"
          git diff --exit-code -- index.html "dist/mappo-$version.html"

      - name: Run smoke tests and directly modified Node tests
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          tests=(tests/build.test.js tests/core.test.js tests/persistence.test.js tests/ci-trigger.test.js)
          # Core preview and worker cancellation are low-cost, high-value
          # regression guards for every active development branch.
          for core_test in tests/road-preview.test.js tests/c7-junction-preview-worker.test.js tests/c7-p2-worker-cancellation.test.js; do
            if [[ -f "$core_test" ]]; then
              tests+=("$core_test")
            fi
          done
          while IFS= read -r path; do
            if [[ "$path" == tests/*.test.js && -f "$path" ]]; then
              tests+=("$path")
            fi
          done < <(git diff --name-only HEAD^ HEAD -- tests/)
          mapfile -t unique_tests < <(printf '%s\n' "${tests[@]}" | sort -u)
          node --test "${unique_tests[@]}"
