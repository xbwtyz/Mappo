name: IDA S1-C2 paired diagnostic
on:
  push:
    branches: ['build/diagnostics/ida-s1-c2-paired']
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    steps:
      - name: Check out exact C1 baseline
        uses: actions/checkout@v4
        with:
          ref: 90b20150cb44c3ba833de2f7b1d059d3c1620e5b
          path: c1
          persist-credentials: false
      - name: Check out exact C2 candidate
        uses: actions/checkout@v4
        with:
          ref: fa13e3e1fba94171514275c670163a95eb875f10
          path: c2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkouts, build parity and common harness
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          for variant in c1 c2; do
            if [[ "$variant" == c1 ]]; then expected=90b20150cb44c3ba833de2f7b1d059d3c1620e5b; else expected=fa13e3e1fba94171514275c670163a95eb875f10; fi
            (
              cd "$variant"
              gitcmd() { git -c safe.directory="$GITHUB_WORKSPACE/$variant" "$@"; }
              test "$(gitcmd rev-parse HEAD)" = "$expected"
              npm run build
              version=$(node --input-type=module -e "import { APP_VERSION } from './src/core/version.js'; process.stdout.write(APP_VERSION)")
              test -s index.html
              test -s "dist/mappo-$version.html"
              gitcmd ls-files --error-unmatch index.html "dist/mappo-$version.html"
              cmp index.html "dist/mappo-$version.html"
              gitcmd diff --exit-code -- index.html "dist/mappo-$version.html"
              npm install --no-save --no-package-lock playwright@1.56.1
            )
          done
          cmp "c1/scripts/building-performance-f4.mjs" "c2/scripts/building-performance-f4.mjs"
          cmp "c1/tests/helpers/transaction-profile.js" "c2/tests/helpers/transaction-profile.js"
          cmp "c1/tests/helpers/building-app.js" "c2/tests/helpers/building-app.js"
          cmp "c1/tests/helpers/building-footprint-fixture.js" "c2/tests/helpers/building-footprint-fixture.js"
      - name: Run counterbalanced F4 comparisons
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          mkdir -p paired-evidence
          for slot in 1-c1 2-c2 3-c2 4-c1; do
            variant="${slot#*-}"
            echo "PAIRED_RUN_BEGIN $slot"
            (
              cd "$variant"
              node scripts/building-performance-f4.mjs
            ) | tee "paired-evidence/$slot.log"
            cp -r "$variant/artifacts" "paired-evidence/$slot-artifacts"
            echo "PAIRED_RUN_END $slot"
          done
      - name: Upload paired evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ida-s1-c2-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: paired-evidence/
          if-no-files-found: error
          retention-days: 14
