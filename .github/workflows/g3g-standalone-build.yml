name: G3G standalone build (temporary)
on:
  push:
    branches:
      - feature/mappo-0.2g-g3g-desktop-parity
    paths:
      - .github/workflows/g3g-standalone-build.yml
      - src/**
      - styles/**
      - package.json
      - index.template.html
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: npm run build
      - name: Commit standalone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/mappo-0.2-dev.g3g.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh G3G standalone after road tab fix"
          git push origin HEAD:feature/mappo-0.2g-g3g-desktop-parity
