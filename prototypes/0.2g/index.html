<script>
'use strict';
// G1 uses fixed, offline scenario data. This file is independent from the app.
const fixture = JSON.parse(document.querySelector('#fixture').textContent);
const $ = id => document.getElementById(id);
const roadId = 'RD-0113', hallId = 'BLD-00061', parcelId = 'PROP-00111';
const road = fixture.original.roads.find(r => r[0] === roadId);
const parcel = fixture.original.properties.find(p => p[0] === parcelId)[1];
const hall = fixture.original.buildings.find(b => b[0] === hallId);
const targets = { roads: roadId, parcels: parcelId, buildings: hallId };
const firstValues = { roads: 18, parcels: 50, buildings: 3 };
const titles = { roads: 'Move road', parcels: 'Split property', buildings: 'Add courtyard' };
const nouns = { roads: 'Road', parcels: 'Property', buildings: 'Building' };
const state = {
  tool:'roads', selected:roadId, view:'map', returnView:'map', draft:null,
  accepted:{ roads:0, parcels:0, buildings:0 }, history:{ roads:[], parcels:[], buildings:[] },
  camera:{x:161,y:-164,zoom:1}, panelWidth:345, dockHeight:238
};
const lerp = (a,b,t) => a.map((v,i)=> v+(b[i]-v)*t);
const clamp = (x,a,b) => Math.max(a,Math.min(x,b));
const impacts = [[hallId,'Market Hall','Placement decision'],...fixture.affected.map(id=>[id,id,'Boundary change'])];
const hasRoadDraft = () => state.draft && state.tool === 'roads';
const hasProposal = () => hasRoadDraft() && state.draft.value === 18;
const roomForComparison = () => innerWidth >= 1600;
const canReview = () => hasProposal() && roomForComparison();
const canApply = () => {
  if(!state.draft) return false;
  const {value,decision} = state.draft;
  if(state.tool==='roads') return value===18 && decision==='relocate';
  return state.tool==='parcels' ? fixture.legalSplits.includes(value) : value>=2 && value<=5;
};
const action = (key,label,attrs='') => `<button data-action="${key}" ${attrs}>${label}</button>`;
const notice = (message,warning=false) => `<div class="notice${warning?' warn':''}">${message}</div>`;

function startDraft() {
  state.draft = { value:firstValues[state.tool], impact:hallId, decision:null, previewPlacement:false };
  setView('map',false);
  update('Preview open. Changes apply when you select Apply.');
}
function setView(view,focus=true) {
  if(view==='dock'&&!hasRoadDraft())return;
  if(view==='compare'&&!canReview())return;
  if(view==='compare'&&state.view!=='compare')state.returnView=state.view;
  state.view=view;
  update();
  if(focus)document.querySelector(`[data-view="${view}"]`).focus();
}
function changeTool(tool) {
  if(tool===state.tool)return;
  if(state.draft){update('Apply or cancel the active edit before switching tools.');return;}
  state.tool=tool;state.selected=targets[tool];frameMap();update();
}
function chooseImpact(id) {
  if(!hasRoadDraft()||!impacts.some(row=>row[0]===id))return;
  state.draft.impact=id;
  update(id===hallId?'Market Hall highlighted.':id+' highlighted.');
}
function editValue(value) {
  if(!state.draft||!Number.isFinite(value))return;
  if(state.draft.value===value)return;
  state.draft.value=value;
  if(state.tool==='roads') {
    state.draft.decision=null;state.draft.previewPlacement=false;
    if(state.view==='compare'&&!canReview())state.view=state.returnView;
  }
  update('Preview updated.',true);
}
function apply() {
  if(!canApply())return;
  state.history[state.tool].push(state.accepted[state.tool]);
  state.accepted[state.tool]=state.draft.value;
  state.draft=null;state.view='map';
  update('Applied to the prototype city. Undo is available.');
}
function cancel() {
  state.draft=null;state.view='map';update('Draft discarded.');$('body').querySelector('[data-action=start]')?.focus();
}
function undo() {
  const history=state.history[state.tool];
  if(state.draft||!history.length)return;
  state.accepted[state.tool]=history.pop();
  update('Reverted the last '+nouns[state.tool].toLowerCase()+' edit.');
}
function detail() {
  const d=state.draft;
  if(!d)return '';
  if(state.tool==='roads'){
    const chosen=d.decision==='relocate';
    if(!hasProposal())return notice('Enter +18 units to review the available relocation.',true);
    if(state.view==='compare'){
      return `<h2>Review Market Hall</h2><p>Compare the building footprint and its entrance route at the same zoom.</p>
        ${notice(chosen?'Placement selected':'Relocation previewed')}
        <div class="buttons">${action('use','Use this placement','class="primary"')}${action('back','Back to '+(state.returnView==='dock'?'impact list':'map editor'))}</div>`;
    }
    if(d.impact!==hallId) {
      return `<div class="card"><h2>${d.impact}</h2><p>This property boundary changes in the preview.</p></div>
        ${action('hall','Review Market Hall')}`;
    }
    return `${notice(chosen?'Placement selected':d.previewPlacement?'Relocation previewed · 1 decision required':'1 decision required',!chosen)}
      <div class="card"><h2>Market Hall</h2><p>${chosen?'The proposed placement fits on the reshaped parcel.':'The current footprint would no longer fit on the reshaped parcel.'}</p></div>
      <div class="buttons">${action('keep','Keep footprint')}${action('preview','Preview relocation')}${action('use','Use this placement',chosen?'aria-pressed="true"':d.previewPlacement?'':'hidden')}</div>${d.decision==='fixed'?notice('Keeping the footprint here blocks Apply.',true):''}`;
  }
  const valid=canApply();
  if(state.tool==='parcels')return notice(valid?`Frontage split ${d.value}% / ${100-d.value}%`:'Move the divider between the existing buildings and leave adequate frontage on both sides.',!valid);
  return notice(valid?'One courtyard inside Market Hall.':'Choose a courtyard width between 2 and 5 units.',!valid);
}
function renderPanels() {
  const d=state.draft;
  if(!d){
    const label=state.tool==='buildings'?'Market Hall':state.selected;
    $('body').innerHTML=`<span class="tag">${nouns[state.tool]} · Inspector</span><h1>${label}</h1>
      <p>${state.tool==='roads'?'Inspect the road beside Market Hall and preview a move.':state.tool==='parcels'?'Inspect the selected property and preview a frontage split between its buildings.':'Inspect Market Hall and open its courtyard editor.'}</p>
      ${state.tool==='roads'&&state.accepted.roads?'<p>Undo the applied road move to replay this scenario.</p>':action('start',titles[state.tool],'class="primary"')}`;
  } else {
    const names={roads:'Offset Y (units)',parcels:'Split position (%)',buildings:'Courtyard width (units)'};
    const field=state.view==='compare'?'':`<label class="field" for="value">${names[state.tool]}<input type="number" step="1" id="value" value="${d.value}"></label>`;
    const intro=state.tool==='roads'&&state.view==='map'?'<p class="optional strong">4 properties affected</p>':'';
    $('body').innerHTML=`<span class="tag">Active edit · ${state.selected}</span><h1 class="optional">${titles[state.tool]}</h1>${field}${intro}<div id="details">${detail()}</div>`;
  }
  $('actions').innerHTML=d?`${action('reset','Reset')}${action('cancel','Cancel')}${action('apply','Apply','class="primary"'+(canApply()?'':' disabled'))}`:'';
  $('dock-list').innerHTML=state.view==='dock'?`<span class="tag">Move road · ${roadId}</span><h2>Review affected features</h2>
    <div class="list">${impacts.map(([id,name,change])=>`<button class="impact-row" data-impact="${id}" aria-pressed="${d.impact===id}"><span>${name}</span><span>${id===hallId&&d.decision==='relocate'?'Placement selected':change}</span></button>`).join('')}</div>`:'';
}
function update(message, keepPanel=false) {
  const active=document.activeElement;
  const restore=active?.dataset.action?[active.dataset.action,'action']:active?.dataset.impact?[active.dataset.impact,'impact']:null;
  if(state.view==='compare'&&!canReview())state.view=hasRoadDraft()&&state.returnView==='dock'?'dock':'map';
  $('workspace').dataset.view=state.view;
  $('comparison-map').hidden=state.view!=='compare';
  $('map-label').textContent=state.view==='compare'?'Before':state.draft?nouns[state.tool]+' preview':'Accepted city';
  $('legend').hidden=!hasRoadDraft()||state.view==='compare';
  document.querySelectorAll('nav [data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===state.tool)));
  document.querySelectorAll('.viewbar [data-view]').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.view===state.view));
    b.disabled=b.dataset.view==='dock'&&!hasRoadDraft()||b.dataset.view==='compare'&&!canReview();
  });
  $('view-note').textContent=state.view==='compare'?'Pan and zoom are linked':hasProposal()&&!roomForComparison()?'Comparison is available on wider windows':'';
  $('mode-status').textContent=state.draft?titles[state.tool]:'Inspecting';
  if(message)$('status').textContent=message;
  $('history').disabled=Boolean(state.draft)||!state.history[state.tool].length;
  $('history').textContent='Undo '+nouns[state.tool].toLowerCase()+' edit';
  $('divider').setAttribute('aria-orientation',state.view==='dock'?'horizontal':'vertical');
  $('divider').setAttribute('aria-label',state.view==='dock'?'Resize impact dock':'Resize edit panel');
  $('divider').setAttribute('aria-valuemin',state.view==='dock'?'184':'285');
  $('divider').setAttribute('aria-valuemax',state.view==='dock'?String(Math.max(184,Math.min(440,innerHeight-310))):'530');
  $('divider').setAttribute('aria-valuenow',String(state.view==='dock'?state.dockHeight:state.panelWidth));
  if(keepPanel){
    $('actions').querySelector('[data-action=apply]').disabled=!canApply();
    $('details').innerHTML=detail();
    const market=$('dock-list').querySelector('[data-impact=BLD-00061] span:last-child');
    if(market)market.textContent=state.draft.decision==='relocate'?'Placement selected':'Placement decision';
  }else renderPanels();
  if(restore)document.querySelector(`[data-${restore[1]}="${restore[0]}"]:not(:disabled)`)?.focus({preventScroll:true});
  scheduleDraw();
}

function frameMap() {
  Object.assign(state.camera,state.tool==='roads'?{x:161,y:-166,zoom:1}:state.tool==='parcels'?{x:189,y:-82,zoom:1.6}:{x:211,y:-176,zoom:1.75});
  scheduleDraw();
}
function zoom(factor) {state.camera.zoom=clamp(state.camera.zoom*factor,.6,6);scheduleDraw();}
function fitCanvas(canvas) {
  const width=canvas.clientWidth,height=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  }
  return {width,height,dpr};
}
function projection(canvas) {
  const {clientWidth:w,clientHeight:h}=canvas;
  const area=$('map-area');
  const sharedWidth=state.view==='compare' ? Math.floor(area.clientWidth/2) : area.clientWidth;
  const scale=Math.min(sharedWidth/210,area.clientHeight/111)*state.camera.zoom;
  return {scale,project:([x,y])=>[(x-state.camera.x)*scale+w/2,(y-state.camera.y)*scale+h/2]};
}
const color={map:'#dde1cc',edge:'#acb79f',block:'#d8dcc2',plot:'#c9d1b8',amber:'#efcf9f',amberLine:'#a25831',green:'#bce1c5',greenLine:'#24785e'};
function renderMap(canvas,side) {
  const {width,height,dpr}=fitCanvas(canvas);if(!width||!height)return;
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const {project}=projection(canvas);

    ctx.beginPath();r.forEach((p,i)=>{
      const q=project(p);i?ctx.lineTo(...q):ctx.moveTo(...q);
    });if(closed)ctx.closePath();
  }
  function polygon(r,fill,stroke,width=1){
    path(r,true);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();
  }
  function line(r,stroke,width=1,dash=[]){
    path(r);ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);
  }
  function label(value,point,fill) {
    const [x,y]=project(point);
    ctx.font='600 12px system-ui';const w=ctx.measureText(value).width+15;
    const left=clamp(x+12,5,width-w-5),top=clamp(y-22,5,height-29);
    ctx.fillStyle=fill;ctx.fillRect(left,top,w,22);ctx.fillStyle='#fff6e5';ctx.fillText(value,left+7,top+15);
  }
  const d=state.draft, roadDraft=hasRoadDraft();
  const acceptedProposed=state.tool==='roads'&&Boolean(state.accepted.roads);
  const relocate=roadDraft&&hasProposal()&&(side==='after'||(side==='overlay'&&(d.previewPlacement||d.decision==='relocate')));
  const map=relocate||acceptedProposed?fixture.proposed:fixture.original;
  ctx.fillStyle=color.map;ctx.fillRect(0,0,width,height);ctx.lineJoin='round';ctx.lineCap='round';
  polygon(map.outline,'#e7ead6',color.edge,1);
  map.blocks.forEach(r=>polygon(r,color.block,'#bbc5ab',.85));
  map.properties.forEach(([id,r])=>{
    const hit=roadDraft&&(relocate?fixture.created:fixture.affected).includes(id);
    const selected=roadDraft&&d.impact===id||state.tool==='parcels'&&id===parcelId;
    polygon(r,selected?'#efd6a9':hit?(relocate?color.green:color.amber):color.plot,
      selected?color.amberLine:hit?(relocate?color.greenLine:color.amberLine):color.edge,selected?2:hit?1.25:.75);
  });
  if(relocate&&d.impact!==hallId){
    const boundary=fixture.original.properties.find(([id])=>id===d.impact)?.[1];
    if(boundary)line([...boundary,boundary[0]],color.amberLine,2,[5,3]);
  }
  polygon(map.plaza,'#efdeac','#b3a477');
  map.roads.forEach(([,a,b,primary])=>{line([a,b],'#a6ab95',primary?7:5);line([a,b],'#f8eed7',primary?5.5:3.6)});
  map.buildings.forEach(([id,ring,holes,tone,access])=>{
    const selected=id===hallId&&(state.tool==='buildings'||roadDraft&&d.impact===hallId);
    polygon(ring,selected?(relocate?'#16775d':'#ad5c36'):['#a38e72','#b6a185','#a68f75'][tone],
      selected?'#fff3d8':'#82745d',selected?2:.7);
    holes.forEach(r=>polygon(r,'#d7dcc5','#82745d',.7));
    if(selected&&access.length>1)line(access,'#fff0ce',1.1,[3,3]);
  });
  if(state.tool==='roads'&&!acceptedProposed){
    const old=road.slice(1,3),next=old.map(([x,y])=>[x,y+(d?.value??0)]);
    if(side!=='after')line(old,roadDraft?'#635a44':'#176950',roadDraft?3:4,roadDraft?[7,5]:[]);
    if(roadDraft&&side!=='before'){
      line(next,'#fffae7',8);line(next,'#0b7b64',4);
    }
  }
  if(state.tool==='parcels'){
    const v=d?.value??state.accepted.parcels;
    if(v){
      const t=clamp(v,0,100)/100;line([lerp(parcel[0],parcel[1],t),lerp(parcel[3],parcel[2],t)],'#fdf1d1',7);
      line([lerp(parcel[0],parcel[1],t),lerp(parcel[3],parcel[2],t)],'#147b63',3,[6,4]);
    }
  }
  if(state.tool==='buildings'&&(d||state.accepted.buildings)){
    const half=clamp(d?.value??state.accepted.buildings,0,10)/2, x=212.8,y=-180.8;
    polygon([[x-half,y-half],[x+half,y-half],[x+half,y+half],[x-half,y+half]],'#f5e9c8','#195e4c',2);
  }
  if(state.tool==='buildings'||roadDraft&&d.impact===hallId){
    const ring=map.buildings.find(b=>b[0]===hallId)?.[1];
    if(ring)label('Market Hall',ring[0],relocate?'#235d4c':'#784627');
  }
}
let drawPending=false;
function scheduleDraw(){
  if(drawPending)return;
  drawPending=true;requestAnimationFrame(()=>{
    drawPending=false;renderMap($('map'),state.view==='compare'?'before':'overlay');
    if(state.view==='compare')renderMap($('proposed-map'),'after');
  });
}
function bindMap(canvas){
  let start=null;

  });

    if(!start)return;

    state.camera.x-=(e.clientX-start.x)/scale;state.camera.y-=(e.clientY-start.y)/scale;
    start.x=e.clientX;start.y=e.clientY;scheduleDraw();
  });

  canvas.addEventListener('pointerup',e=>{
    if(start&&Math.hypot(e.clientX-start.originalX,e.clientY-start.originalY)<4){
      if(hasRoadDraft()){

        function hit(ring){
          const path=new Path2D();
          ring.forEach((p,i)=>{const q=project(p);i?path.lineTo(...q):path.moveTo(...q)});
          path.closePath();
          ctx.save();ctx.setTransform(1,0,0,1,0,0);const result=ctx.isPointInPath(path,...point);ctx.restore();return result;
        }
        const showingProposal=canvas.id==='proposed-map'||state.view!=='compare'&&(state.draft.previewPlacement||state.draft.decision==='relocate');
        const map=showingProposal?fixture.proposed:fixture.original;
        if(hit(map.buildings.find(b=>b[0]===hallId)[1]))chooseImpact(hallId);
        else {
          const property=fixture.original.properties.find(([id,ring])=>fixture.affected.includes(id)&&hit(ring));
          if(property)chooseImpact(property[0]);
        }
      } else update(nouns[state.tool]+' '+state.selected+' selected.');
    }
    start=null;
  });
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.002));},{passive:false});
  canvas.addEventListener('keydown',e=>{
    const delta={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];
    if(delta){state.camera.x+=delta[0];state.camera.y+=delta[1];scheduleDraw();e.preventDefault();}
    if(['+','=','-'].includes(e.key)){zoom(e.key==='-'?1/1.2:1.2);e.preventDefault();}
  });
}
function resizePanels(delta) {
  if(state.view==='dock')state.dockHeight=clamp(state.dockHeight+delta,184,Math.max(184,Math.min(440,innerHeight-310)));
  else state.panelWidth=clamp(state.panelWidth+delta,285,530);
  document.documentElement.style.setProperty('--panel-width',state.panelWidth+'px');
  document.documentElement.style.setProperty('--dock-height',state.dockHeight+'px');
  $('divider').setAttribute('aria-valuenow',String(state.view==='dock'?state.dockHeight:state.panelWidth));
  scheduleDraw();
}
let lastSize=null;
$('divider').addEventListener('pointerdown',e=>{if(e.button!==0)return;lastSize=state.view==='dock'?e.clientY:e.clientX;$('divider').setPointerCapture(e.pointerId);$('divider').focus()});
$('divider').addEventListener('pointermove',e=>{
  if(lastSize===null)return;const v=state.view==='dock'?e.clientY:e.clientX;resizePanels(lastSize-v);lastSize=v;
});
$('divider').addEventListener('lostpointercapture',()=>{lastSize=null;});
$('divider').addEventListener('keydown',e=>{
  const keys=state.view==='dock'?['ArrowUp','ArrowDown']:['ArrowLeft','ArrowRight'];
  if(keys.includes(e.key)){e.preventDefault();resizePanels(e.key===keys[0]?16:-16);}
});
const commands={
  start:startDraft,apply,cancel,undo,
  reset:()=>{state.draft.value=firstValues[state.tool];state.draft.decision=null;state.draft.previewPlacement=false;update('Preview reset.');},
  hall:()=>chooseImpact(hallId),
  keep:()=>{state.draft.decision='fixed';state.draft.previewPlacement=false;update('Keeping Market Hall here blocks Apply.');},
  preview:()=>{if(canReview())setView('compare');else {state.draft.previewPlacement=true;update('Proposed relocation shown on this map. Select Use this placement to accept the decision.');}},
  use:()=>{state.draft.decision='relocate';state.draft.previewPlacement=true;update('Proposed Market Hall placement selected.');},
  back:()=>setView(state.returnView),
  'zoom-out':()=>zoom(1/1.2),'zoom-in':()=>zoom(1.2),frame:frameMap
};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.view)setView(b.dataset.view);
  if(b.dataset.tool)changeTool(b.dataset.tool);
  if(b.dataset.impact)chooseImpact(b.dataset.impact);
  commands[b.dataset.action]?.();
});
document.addEventListener('change',e=>{if(e.target.id==='value'){
  const nearest=e.target.valueAsNumber;
  if(Number.isFinite(nearest))editValue(nearest);else update('Enter a numeric value.');
}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(state.view==='compare')setView(state.returnView);
    else if(state.view==='dock')setView('map');
    else if(state.draft)cancel();
  }
});
window.addEventListener('resize',()=>update());
new ResizeObserver(scheduleDraw).observe($('map-area'));
bindMap($('map'));bindMap($('proposed-map'));frameMap();update();
</script>
</body>
</html>
